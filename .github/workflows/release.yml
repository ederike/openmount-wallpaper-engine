name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bundle:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: --target universal-apple-darwin
            rust_targets: aarch64-apple-darwin,x86_64-apple-darwin
          - platform: windows-latest
            args: --bundles nsis,msi
            rust_targets: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_targets }}
      - uses: Swatinem/rust-cache@v2
      - name: Install frontend deps
        run: npm ci
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "OpenMount ${{ github.ref_name }}"
          releaseBody: |
            OpenMount Wallpaper Engine ${{ github.ref_name }}

            GPL-3.0-or-later. Source: this repository.

            - Scroll canvas pre-decodes nearby images so the reel stays smooth on macOS
            - Image headers are read in Rust so a 10k+ pool does not load every file in the webview
            - Windows tray is a single icon with the app menu (minimize no longer leaves a blank extra icon)
            - Wallpaper sits behind desktop icons on Windows 11 24H2 and macOS
            - Scroll pause/resume keeps the current position
            - In-app update check

            Bundles:
            - Windows x86_64: NSIS installer and MSI
            - macOS Universal (Apple Silicon + Intel): DMG
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: true
          args: ${{ matrix.args }}
