[workspace]
members = ["crates/omwe-core", "src-tauri"]
default-members = ["crates/omwe-core"]
resolver = "2"

[workspace.package]
version = "0.2.1"
edition = "2021"
license = "GPL-3.0-or-later"
rust-version = "1.90"
authors = ["OpenMount contributors"]
repository = "https://github.com/ederike/openmount-wallpaper-engine"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
uuid = { version = "1", features = ["v4", "serde"] }
thiserror = "2"
walkdir = "2"
chrono = { version = "0.4", features = ["serde", "clock"] }
log = "0.4"
tempfile = "3"
